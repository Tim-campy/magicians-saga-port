name: progress

# Fast checks and the progress page; runs on every push to main (about 30 s).
# The Linux C++ build lives in linux.yml and only runs when C++ files change.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependency
        run: python -m pip install pillow==12.0.0
      - name: Python tests
        run: python3 -I tools/run_tests.py
      - name: Check links and roadmap
        run: |
          python3 -I tools/check_links.py
          python3 -I tools/check_roadmap.py
      - name: Check registries
        run: |
          python3 -I tools/registry.py check
          python3 -I tools/progress.py --check
      - name: Build progress site
        run: python3 -I tools/progress.py build/progress
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/progress

  deploy:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
